<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Privacy Shield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }
        .brand-logo {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin: 0 auto 20px;
        }
        h2 { color: #fff; font-weight: 700; }
        p.subtitle { color: rgba(255,255,255,0.6); font-size: 0.9rem; }
        .form-label { color: rgba(255,255,255,0.8); font-size: 0.85rem; font-weight: 500; }
        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 10px;
            padding: 12px 16px;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: #764ba2;
            color: #fff;
            box-shadow: 0 0 0 3px rgba(118,75,162,0.3);
        }
        .form-control::placeholder { color: rgba(255,255,255,0.3); }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none; border-radius: 10px;
            padding: 13px; font-weight: 600; font-size: 1rem;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-primary:hover { transform: translateY(-1px); opacity: 0.95; }
        a { color: #a78bfa; }
        a:hover { color: #c4b5fd; }
        .alert { border-radius: 10px; font-size: 0.88rem; }
        .text-muted-light { color: rgba(255,255,255,0.4); font-size: 0.85rem; }
        .profile-upload-label {
            display: block; cursor: pointer;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 10px; padding: 20px;
            text-align: center; color: rgba(255,255,255,0.5);
            transition: border-color 0.2s;
        }
        .profile-upload-label:hover { border-color: #764ba2; color: #a78bfa; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="auth-card text-center">
        <div class="brand-logo">🛡️</div>
        <h2>Create Account</h2>
        <p class="subtitle mb-4">Join Privacy Shield and start protecting your digital identity</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" enctype="multipart/form-data" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="row g-3 text-start">
                <div class="col-12">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="fullname" class="form-control" placeholder="Jane Smith" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" name="phone" class="form-control" placeholder="+1 234 567 8900">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Address</label>
                    <input type="text" name="address" class="form-control" placeholder="City, Country" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Age</label>
                    <input type="number" name="age" class="form-control" placeholder="e.g. 25" min="1" max="150" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Place</label>
                    <select name="place" class="form-control" required style="appearance: auto;">
                        <option value="" disabled selected>Select District</option>
                        <option value="Thiruvananthapuram">Thiruvananthapuram</option>
                        <option value="Kollam">Kollam</option>
                        <option value="Pathanamthitta">Pathanamthitta</option>
                        <option value="Alappuzha">Alappuzha</option>
                        <option value="Kottayam">Kottayam</option>
                        <option value="Idukki">Idukki</option>
                        <option value="Ernakulam">Ernakulam</option>
                        <option value="Thrissur">Thrissur</option>
                        <option value="Palakkad">Palakkad</option>
                        <option value="Malappuram">Malappuram</option>
                        <option value="Kozhikode">Kozhikode</option>
                        <option value="Wayanad">Wayanad</option>
                        <option value="Kannur">Kannur</option>
                        <option value="Kasaragod">Kasaragod</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Profile Photo <span class="text-muted-light">(optional)</span></label>
                    <label class="profile-upload-label" for="profile-input" id="profile-label">
                        📷 Click to upload a profile photo
                    </label>
                    <input type="file" id="profile-input" name="profile" accept="image/*"
                           onchange="document.getElementById('profile-label').textContent = this.files[0]?.name || '📷 Click to upload a profile photo'">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" id="password" class="form-control" placeholder="Min. 8 characters" required minlength="8">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Repeat password" required>
                </div>
                <div class="col-12" id="pw-match-msg"></div>
            </div>

            <div class="d-grid mt-4 mb-3">
                <button type="submit" class="btn btn-primary">Create My Account</button>
            </div>
        </form>

        <p class="text-muted-light">
            Already have an account? <a href="{% url 'login' %}">Sign in</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const pw = document.getElementById('password');
        const cpw = document.getElementById('confirm_password');
        const msg = document.getElementById('pw-match-msg');
        function checkMatch() {
            if (cpw.value && pw.value !== cpw.value) {
                msg.innerHTML = '<small class="text-danger">Passwords do not match</small>';
            } else if (cpw.value) {
                msg.innerHTML = '<small class="text-success">✓ Passwords match</small>';
            } else {
                msg.innerHTML = '';
            }
        }
        pw.addEventListener('input', checkMatch);
        cpw.addEventListener('input', checkMatch);
    </script>
</body>
</html>
