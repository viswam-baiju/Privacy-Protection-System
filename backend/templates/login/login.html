<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Privacy Shield</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }
        .brand-logo {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin: 0 auto 20px;
        }
        h2 { color: #fff; font-weight: 700; }
        p.subtitle { color: rgba(255,255,255,0.6); font-size: 0.9rem; }
        .form-label { color: rgba(255,255,255,0.8); font-size: 0.85rem; font-weight: 500; }
        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 10px;
            padding: 12px 16px;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: #764ba2;
            color: #fff;
            box-shadow: 0 0 0 3px rgba(118,75,162,0.3);
        }
        .form-control::placeholder { color: rgba(255,255,255,0.3); }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none; border-radius: 10px;
            padding: 13px; font-weight: 600; font-size: 1rem;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-primary:hover { transform: translateY(-1px); opacity: 0.95; }
        .divider { color: rgba(255,255,255,0.3); }
        a { color: #a78bfa; }
        a:hover { color: #c4b5fd; }
        .alert { border-radius: 10px; font-size: 0.88rem; }
    </style>
</head>
<body>
    <div class="auth-card text-center">
        <div class="brand-logo">🔐</div>
        <h2>Welcome Back</h2>
        <p class="subtitle mb-4">Sign in to Privacy Shield to monitor your images</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3 text-start">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary">Sign In</button>
            </div>
        </form>

        <p class="divider mb-0" style="font-size: 0.85rem;">
            Don't have an account? <a href="{% url 'register' %}">Create one</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
