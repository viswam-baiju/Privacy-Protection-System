<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectMe - Social Media</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .navbar { background-color: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .post-card { border-radius: 10px; border: none; box-shadow: 0 1px 2px rgba(0,0,0,.2); margin-bottom: 20px; }
        .profile-pic { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#">ConnectMe</a>
            <input class="form-control w-50" type="search" placeholder="Search ConnectMe">
        </div>
    </nav>
    <div class="container" style="margin-top: 80px;">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card post-card">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <img src="https://via.placeholder.com/40" class="profile-pic me-2" alt="User">
                            <div>
                                <h6 class="mb-0">John Doe</h6>
                                <small class="text-muted">2 hours ago</small>
                            </div>
                        </div>
                        <p class="card-text">Having a great day at the beach! 🏖️</p>
                        <!-- Target Image placeholder -->
                        <img src="{% if MEDIA_URL %}{{ MEDIA_URL }}fake_apps/social_media/class.jpeg{% else %}https://via.placeholder.com/600x400{% endif %}" class="img-fluid rounded" alt="Post Image">
                    </div>
                    <div class="card-footer bg-white border-0">
                        <button class="btn btn-light btn-sm"><i class="bi bi-hand-thumbs-up"></i> Like</button>
                        <button class="btn btn-light btn-sm"><i class="bi bi-chat"></i> Comment</button>
                        <button class="btn btn-light btn-sm"><i class="bi bi-share"></i> Share</button>
                    </div>
                </div>
                
                 <div class="card post-card">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <img src="https://via.placeholder.com/40" class="profile-pic me-2" alt="User">
                            <div>
                                <h6 class="mb-0">Alice Smith</h6>
                                <small class="text-muted">5 hours ago</small>
                            </div>
                        </div>
                        <p class="card-text">New profile picture! ✨</p>
                        <!-- Leak Target -->
                        <img src="{% if MEDIA_URL %}{{ MEDIA_URL }}fake_apps/social_media/alice_profile.jpg{% else %}https://via.placeholder.com/600x400{% endif %}" class="img-fluid rounded" alt="Profile Leak">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
