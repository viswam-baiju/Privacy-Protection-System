<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchMaker Premium</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #ffc3a0 0%, #ffafbd 100%); 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 0;
            margin: 0;
        }
        
        .dating-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            max-width: 1000px;
            width: 100%;
        }

        .app-container { 
            width: 100%;
            max-width: 380px; 
            background: #ffffff; 
            border-radius: 28px; 
            overflow: hidden; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15), 0 1px 3px rgba(0,0,0,0.05); 
            position: relative;
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .app-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.2), 0 2px 5px rgba(0,0,0,0.1); 
        }

        .header { 
            position: absolute;
            top: 0; left: 0; right: 0;
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white; 
            padding: 16px 20px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800; 
            font-size: 1.25rem;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .profile-img-wrapper {
            position: relative;
            width: 100%;
            height: 480px;
        }

        .profile-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        
        .image-overlay-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            pointer-events: none;
        }

        .profile-info { 
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            color: white;
            z-index: 5;
        }

        .profile-info h3 {
            font-weight: 800;
            font-size: 2rem;
            margin-bottom: 0.2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .profile-info h3 span {
            font-weight: 400;
            font-size: 1.5rem;
            opacity: 0.9;
        }

        .info-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 8px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .bio-text {
            font-size: 0.95rem;
            line-height: 1.4;
            opacity: 0.9;
            margin-bottom: 0;
            font-weight: 500;
        }

        .action-buttons { 
            padding: 24px; 
            display: flex; 
            justify-content: center; 
            gap: 1.5rem;
            background: #ffffff;
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
        }

        .btn-action { 
            width: 65px; 
            height: 65px; 
            border-radius: 50%; 
            font-size: 28px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: white;
            border: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        
        .btn-action:hover {
            transform: scale(1.15);
        }
        
        .btn-action:active {
            transform: scale(0.95);
        }
        
        .btn-nope { color: #fd5c63; }
        .btn-nope:hover { box-shadow: 0 10px 25px rgba(253, 92, 99, 0.3); }
        
        .btn-super { color: #21b6d9; width: 50px; height: 50px; font-size: 20px; align-self: flex-end; margin-bottom: 5px;}
        .btn-super:hover { box-shadow: 0 10px 25px rgba(33, 182, 217, 0.3); }
        
        .btn-like { color: #1bd09e; }
        .btn-like:hover { box-shadow: 0 10px 25px rgba(27, 208, 158, 0.3); }

    </style>
</head>
<body>
    <div class="dating-wrapper">
        <!-- Card 1 -->
        <div class="app-container">
            <div class="header">
                <i class="fa-solid fa-fire text-white me-2" style="font-size: 1.4rem;"></i>
                <span style="letter-spacing: 1px;">MatchMaker</span>
                <i class="fa-solid fa-sliders" style="font-size: 1.2rem; opacity: 0.8;"></i>
            </div>
            
            <div class="profile-img-wrapper">
                <!-- Target Image for Leaks -->
                <img src="{% if MEDIA_URL %}{{ MEDIA_URL }}fake_apps/dating_app/fake_profile.jpg{% else %}https://images.unsplash.com/photo-1524250502761-1ac6f2e30d43?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80{% endif %}" class="profile-img" alt="Profile">
                <div class="image-overlay-gradient"></div>
                
                <div class="profile-info">
                    <h3>Sarah <span>24</span></h3>
                    <div class="info-badge">
                        <i class="fa-solid fa-location-dot me-2"></i> 5 miles away
                    </div>
                    <p class="bio-text">Love hiking, dogs, and spontaneous road trips! Message me if you look like my next mistake ✨</p>
                </div>
            </div>
            
            <div class="action-buttons">
                <button class="btn-action btn-nope"><i class="fa-solid fa-xmark"></i></button>
                <button class="btn-action btn-super"><i class="fa-solid fa-star"></i></button>
                <button class="btn-action btn-like"><i class="fa-solid fa-heart"></i></button>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="app-container">
            <div class="header">
                <i class="fa-solid fa-fire text-white me-2" style="font-size: 1.4rem;"></i>
                <span style="letter-spacing: 1px;">MatchMaker</span>
                <i class="fa-solid fa-sliders" style="font-size: 1.2rem; opacity: 0.8;"></i>
            </div>
            
            <div class="profile-img-wrapper">
                <!-- Target Image for Leaks -->
                <img src="{% if MEDIA_URL %}{{ MEDIA_URL }}fake_apps/dating_app/a.jpeg{% else %}https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80{% endif %}" class="profile-img" alt="Profile">
                <div class="image-overlay-gradient"></div>
                
                <div class="profile-info">
                    <h3>Jessica <span>26</span></h3>
                    <div class="info-badge">
                        <i class="fa-solid fa-location-dot me-2"></i> 12 miles away
                    </div>
                    <p class="bio-text">Coffee addict. Probably at a thrift store or taking pictures of my food. Let's grab a drink? 🍸</p>
                </div>
            </div>
            
            <div class="action-buttons">
                <button class="btn-action btn-nope"><i class="fa-solid fa-xmark"></i></button>
                <button class="btn-action btn-super"><i class="fa-solid fa-star"></i></button>
                <button class="btn-action btn-like"><i class="fa-solid fa-heart"></i></button>
            </div>
        </div>
    </div>
</body>
</html>
